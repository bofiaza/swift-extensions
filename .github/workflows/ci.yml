name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 ships Xcode 16 (Swift 6.0/6.1); macos-26 ships Xcode 26 (Swift 6.2),
        # which also compiles the glassEffect code path.
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    name: Build & test Foundation (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      # Package.swift leaves out the SwiftUI target on non-Apple platforms.
      - name: Build
        run: swift build
      - name: Test
        run: swift test
